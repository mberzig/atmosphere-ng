_kyverno_helm_values:
  admissionController:
    initContainer:
      image:
        registry: "{{ atmosphere_images['kyverno_init'] | vexxhost.kubernetes.docker_image('domain') }}"
        repository: "{{ atmosphere_images['kyverno_init'] | vexxhost.kubernetes.docker_image('path') }}"
        tag: "{{ atmosphere_images['kyverno_init'] | vexxhost.kubernetes.docker_image('tag') }}"
    container:
      image:
        registry: "{{ atmosphere_images['kyverno'] | vexxhost.kubernetes.docker_image('domain') }}"
        repository: "{{ atmosphere_images['kyverno'] | vexxhost.kubernetes.docker_image('path') }}"
        tag: "{{ atmosphere_images['kyverno'] | vexxhost.kubernetes.docker_image('tag') }}"
  backgroundController:
    image:
      registry: "{{ atmosphere_images['kyverno_background_controller'] | vexxhost.kubernetes.docker_image('domain') }}"
      repository: "{{ atmosphere_images['kyverno_background_controller'] | vexxhost.kubernetes.docker_image('path') }}"
      tag: "{{ atmosphere_images['kyverno_background_controller'] | vexxhost.kubernetes.docker_image('tag') }}"
  cleanupController:
    image:
      registry: "{{ atmosphere_images['kyverno_cleanup_controller'] | vexxhost.kubernetes.docker_image('domain') }}"
      repository: "{{ atmosphere_images['kyverno_cleanup_controller'] | vexxhost.kubernetes.docker_image('path') }}"
      tag: "{{ atmosphere_images['kyverno_cleanup_controller'] | vexxhost.kubernetes.docker_image('tag') }}"
  reportsController:
    image:
      registry: "{{ atmosphere_images['kyverno_reports_controller'] | vexxhost.kubernetes.docker_image('domain') }}"
      repository: "{{ atmosphere_images['kyverno_reports_controller'] | vexxhost.kubernetes.docker_image('path') }}"
      tag: "{{ atmosphere_images['kyverno_reports_controller'] | vexxhost.kubernetes.docker_image('tag') }}"
