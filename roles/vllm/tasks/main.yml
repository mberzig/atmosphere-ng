- name: Create namespace
  run_once: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ vllm_namespace }}"

- name: Create model cache volumes
  run_once: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: vllm-{{ item.name }}-cache
        namespace: "{{ vllm_namespace }}"
      spec: >-
        {{
          {
            'accessModes': ['ReadWriteOnce'],
            'resources': {'requests': {'storage': vllm_cache_size}},
          } | combine(
            {'storageClassName': vllm_cache_storage_class}
            if vllm_cache_storage_class else {}
          )
        }}
  loop: "{{ vllm_models }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create model servers
  run_once: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vllm-{{ item.name }}
        namespace: "{{ vllm_namespace }}"
        labels:
          app.kubernetes.io/name: vllm
          app.kubernetes.io/instance: "{{ item.name }}"
      spec:
        replicas: "{{ item.replicas | default(1) }}"
        selector:
          matchLabels:
            app.kubernetes.io/name: vllm
            app.kubernetes.io/instance: "{{ item.name }}"
        strategy:
          type: Recreate
        template:
          metadata:
            labels:
              app.kubernetes.io/name: vllm
              app.kubernetes.io/instance: "{{ item.name }}"
          spec:
            runtimeClassName: nvidia
            containers:
              - name: vllm
                image: "{{ atmosphere_images['vllm'] | vexxhost.kubernetes.docker_image('ref') }}"
                args: "{{ ['--model', item.model] + (item.args | default([])) }}"
                ports:
                  - name: http
                    containerPort: 8000
                readinessProbe:
                  httpGet:
                    path: /health
                    port: http
                  initialDelaySeconds: 30
                  periodSeconds: 10
                livenessProbe:
                  httpGet:
                    path: /health
                    port: http
                  initialDelaySeconds: 120
                  periodSeconds: 30
                resources:
                  requests: "{{ item.resources | default({'nvidia.com/gpu': 1}) }}"
                  limits: "{{ item.resources | default({'nvidia.com/gpu': 1}) }}"
                volumeMounts:
                  - name: cache
                    mountPath: /root/.cache/huggingface
                  - name: shm
                    mountPath: /dev/shm
            volumes:
              - name: cache
                persistentVolumeClaim:
                  claimName: vllm-{{ item.name }}-cache
              - name: shm
                emptyDir:
                  medium: Memory
  loop: "{{ vllm_models }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create model services
  run_once: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: vllm-{{ item.name }}
        namespace: "{{ vllm_namespace }}"
        labels:
          app.kubernetes.io/name: vllm
          app.kubernetes.io/instance: "{{ item.name }}"
      spec:
        selector:
          app.kubernetes.io/name: vllm
          app.kubernetes.io/instance: "{{ item.name }}"
        ports:
          - name: http
            port: 80
            targetPort: http
  loop: "{{ vllm_models }}"
  loop_control:
    label: "{{ item.name }}"
