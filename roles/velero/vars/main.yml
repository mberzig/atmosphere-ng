_velero_helm_values:
  image:
    repository: "{{ atmosphere_images['velero'] | vexxhost.kubernetes.docker_image('domain') }}/{{ atmosphere_images['velero'] | vexxhost.kubernetes.docker_image('path') }}"
    tag: "{{ atmosphere_images['velero'] | vexxhost.kubernetes.docker_image('tag') }}"
  initContainers:
    - name: velero-plugin-for-aws
      image: "{{ atmosphere_images['velero_plugin_for_aws'] | vexxhost.kubernetes.docker_image('ref') }}"
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins
  kubectl:
    image:
      repository: "{{ atmosphere_images['velero_kubectl'] | vexxhost.kubernetes.docker_image('domain') }}/{{ atmosphere_images['velero_kubectl'] | vexxhost.kubernetes.docker_image('path') }}"
      tag: "{{ atmosphere_images['velero_kubectl'] | vexxhost.kubernetes.docker_image('tag') }}"
  configuration:
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: "{{ velero_storage_bucket }}"
        default: true
        config:
          region: "{{ velero_storage_region }}"
          s3ForcePathStyle: "true"
          s3Url: "{{ velero_storage_url }}"
          checksumAlgorithm: ""
    volumeSnapshotLocation: []
    features: EnableCSI
    defaultSnapshotMoveData: true
  credentials:
    useSecret: true
    secretContents:
      cloud: |
        [default]
        aws_access_key_id={{ velero_storage_access_key }}
        aws_secret_access_key={{ velero_storage_secret_key }}
  snapshotsEnabled: false
  deployNodeAgent: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  schedules: "{{ velero_schedules }}"
