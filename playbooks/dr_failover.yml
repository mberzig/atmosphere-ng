# This playbook promotes the mirrored RBD pools on the region it runs
# against, making it the new primary for the replicated data. It is meant
# to be executed as a step of the disaster recovery runbook and requires
# an explicit confirmation since promoting a region while the peer is
# still active leads to a split-brain.
#
# Set "dr_failover_force=true" when the peer region is lost and cannot
# demote its images first.

- name: Fail over the mirrored pools to this region
  hosts: "{{ ceph_control_plane_group | default('controllers') }}"
  become: true
  vars:
    dr_failover_force: false
  vars_prompt:
    - name: dr_failover_confirm
      prompt: >-
        This step promotes the mirrored RBD pools on THIS region and makes
        it the new primary for the replicated data. Type "failover" to
        continue
      private: false
  pre_tasks:
    - name: Validate the confirmation
      run_once: true
      ansible.builtin.assert:
        that:
          - dr_failover_confirm == 'failover'
        fail_msg: The failover was not confirmed, no change was made.
        quiet: true

    - name: Assert that mirrored pools are configured
      run_once: true
      ansible.builtin.assert:
        that:
          - ceph_rbd_mirror_pools | default([]) | length > 0
        fail_msg: >-
          The "ceph_rbd_mirror_pools" variable is empty, there is nothing
          to promote on this region.
        quiet: true
  tasks:
    - name: Get mirroring status of pools before the promotion
      run_once: true
      ansible.builtin.command:
        cmd: cephadm shell -- rbd mirror pool status {{ item.name }}
      changed_when: false
      loop: "{{ ceph_rbd_mirror_pools }}"
      loop_control:
        label: "{{ item.name }}"
      register: _dr_failover_status_before

    - name: Display the mirroring status of pools before the promotion
      run_once: true
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ _dr_failover_status_before.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Promote the mirrored pools on this region
      run_once: true
      ansible.builtin.command:
        cmd: >-
          cephadm shell -- rbd mirror pool promote
          {% if dr_failover_force | bool %}--force{% endif %}
          {{ item.name }}
      register: _dr_failover_promote
      failed_when:
        - _dr_failover_promote.rc != 0
        - "'primary' not in _dr_failover_promote.stderr"
      loop: "{{ ceph_rbd_mirror_pools }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Get mirroring status of pools after the promotion
      run_once: true
      ansible.builtin.command:
        cmd: cephadm shell -- rbd mirror pool status {{ item.name }}
      changed_when: false
      loop: "{{ ceph_rbd_mirror_pools }}"
      loop_control:
        label: "{{ item.name }}"
      register: _dr_failover_status_after

    - name: Display the mirroring status of pools after the promotion
      run_once: true
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ _dr_failover_status_after.results }}"
      loop_control:
        label: "{{ item.item.name }}"
