- name: Configure Disaster Recovery
  hosts: "{{ ceph_control_plane_group | default('controllers') }}"
  become: true
  roles:
    - role: ceph_rbd_mirror
      when: atmosphere_rbd_mirror_enabled | default(false)
      tags:
        - ceph-rbd-mirror
