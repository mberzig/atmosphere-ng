velero_helm_release_name: velero
velero_helm_chart_path: "../../charts/velero/"
velero_helm_chart_ref: /usr/local/src/velero
velero_helm_release_namespace: velero
velero_helm_kubeconfig: "{{ kubeconfig_path | default('/etc/kubernetes/admin.conf') }}"
velero_helm_values: {}

# URL of the S3-compatible endpoint where the backups are stored.  It
# defaults to the RadosGW instance managed by the Rook Ceph cluster role.
#
# velero_storage_url: https://s3.example.com
velero_storage_url: "http://rook-ceph-rgw-{{ rook_ceph_cluster_name | default('ceph') }}.{{ rook_ceph_cluster_helm_release_namespace | default('openstack') }}.svc"

# Name of the bucket where the backups are stored.  The bucket must exist
# before Velero is deployed.
#
# velero_storage_bucket: velero
velero_storage_bucket: velero

# Region of the S3-compatible endpoint.  The default value is accepted by
# RadosGW, set this to the real region when using another object store.
#
# velero_storage_region: us-east-1
velero_storage_region: default

# Access key used to read and write the backup bucket.
#
# velero_storage_access_key: velero
velero_storage_access_key: ""

# Secret key used to read and write the backup bucket.
#
# velero_storage_secret_key: secret
velero_storage_secret_key: ""

# Backup schedules to create, keyed by schedule name.  The default takes
# a daily backup of all namespaces with a 30 day retention, you can add
# more schedules to take backups of specific namespaces with their own
# retention based on the recovery objectives of the workloads.
#
# velero_schedules:
#   tenant-daily:
#     schedule: "0 2 * * *"
#     template:
#       ttl: 336h
#       includedNamespaces:
#         - my-namespace
velero_schedules:
  platform-daily:
    schedule: "0 1 * * *"
    template:
      ttl: 720h
      includedNamespaces:
        - "*"

# Label whose value assigns a namespace to a continuity tier. Every tier
# defined in "velero_tier_schedules" backs up exactly the namespaces
# labeled with it, with the list of namespaces reconciled periodically
# from the labels.
#
# velero_tier_label: kubecenter.dz/dr-tier
velero_tier_label: kubecenter.dz/dr-tier

# Backup schedules per continuity tier, keyed by the value of the tier
# label. The default tiers take a daily backup with a 30 day retention
# for the standard tier and a 14 day retention for the continuity tier,
# which also relies on the storage replication for its recovery point.
# An empty mapping disables the tier driven schedules.
#
# velero_tier_schedules:
#   t1:
#     schedule: "0 1 * * *"
#     ttl: 720h
velero_tier_schedules:
  t1:
    schedule: "0 1 * * *"
    ttl: 720h
  t2:
    schedule: "0 1 * * *"
    ttl: 336h

# How often the tier labels of the namespaces are reconciled into the
# tier schedules.
#
# velero_tier_reconcile_schedule: "*/15 * * * *"
velero_tier_reconcile_schedule: "*/15 * * * *"

# Create the backup bucket on the S3 endpoint if it does not exist yet,
# using the credentials of the backup storage location.
#
# velero_storage_create_bucket: true
velero_storage_create_bucket: false

# Days of S3 Object Lock retention applied in compliance mode to the
# objects of the bucket, which makes the backups immutable: nobody can
# delete or shorten them before they expire, not even an administrator.
# It requires "velero_storage_create_bucket" since the lock must be
# enabled when the bucket is created, and it must stay below the
# shortest schedule retention so that the expired backups can be
# garbage collected. A value of 0 disables the lock.
#
# velero_storage_object_lock_days: 14
velero_storage_object_lock_days: 0
