# Placement of the rbd-mirror daemon, using the placement specification
# format of the Ceph orchestrator.
#
# ceph_rbd_mirror_placement:
#   label: rbd-mirror
ceph_rbd_mirror_placement:
  count: 1

# Name identifying this cluster when creating or importing peer bootstrap
# tokens, usually the name of the region or the site.
#
# ceph_rbd_mirror_site_name: primary
ceph_rbd_mirror_site_name: ""

# Pools to enable snapshot-based mirroring on, with the interval between
# two mirror snapshots which drives the recovery point objective of the
# data stored in the pool.
#
# ceph_rbd_mirror_pools:
#   - name: volumes-dr
#     interval: 15m
ceph_rbd_mirror_pools: []

# Create a peer bootstrap token for every mirrored pool and store it on
# the host as /etc/ceph/rbd-mirror-peer-<pool>.token, to be imported on
# the peer cluster.
#
# ceph_rbd_mirror_bootstrap_create: true
ceph_rbd_mirror_bootstrap_create: false

# Peer bootstrap tokens to import, as generated by the peer cluster.  The
# pool must also be listed in the "ceph_rbd_mirror_pools" variable and the
# direction can be set to "rx-only" for one-way mirroring.
#
# ceph_rbd_mirror_peers:
#   - pool: volumes-dr
#     token: <token generated by the peer cluster>
#     direction: rx-tx
ceph_rbd_mirror_peers: []
