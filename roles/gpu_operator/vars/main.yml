_gpu_operator_helm_values:
  operator:
    repository: "{{ atmosphere_images['gpu_operator'] | vexxhost.kubernetes.docker_image('domain') }}/{{ (atmosphere_images['gpu_operator'] | vexxhost.kubernetes.docker_image('path')) | dirname }}"
    image: "{{ (atmosphere_images['gpu_operator'] | vexxhost.kubernetes.docker_image('path')) | basename }}"
    version: "{{ atmosphere_images['gpu_operator'] | vexxhost.kubernetes.docker_image('tag') }}"
  # Node Feature Discovery is already deployed by Atmosphere, the one
  # embedded in the chart stays disabled to avoid running two instances.
  nfd:
    enabled: false
  # The mixed strategy allows full GPUs and MIG instances to coexist in
  # the same cluster, with the partitioning of each node driven by its
  # "nvidia.com/mig.config" label.
  mig:
    strategy: mixed
  dcgmExporter:
    serviceMonitor:
      enabled: true
