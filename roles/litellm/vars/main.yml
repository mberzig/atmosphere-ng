_litellm_general_settings: >-
  {{
    {'master_key': 'os.environ/LITELLM_MASTER_KEY'}
    | combine(
        {'database_url': 'os.environ/DATABASE_URL'}
        if litellm_database_url else {}
      )
  }}

_litellm_config:
  model_list: "{{ litellm_model_list }}"
  general_settings: "{{ _litellm_general_settings }}"
  litellm_settings:
    drop_params: true

_litellm_env: >-
  {{
    [{'name': 'LITELLM_MASTER_KEY',
      'valueFrom': {'secretKeyRef': {'name': 'litellm', 'key': 'master-key'}}}]
    + ([{'name': 'DATABASE_URL',
         'valueFrom': {'secretKeyRef': {'name': 'litellm', 'key': 'database-url'}}}]
       if litellm_database_url else [])
  }}
