kyverno_helm_release_name: kyverno
kyverno_helm_chart_path: "../../charts/kyverno/"
kyverno_helm_chart_ref: /usr/local/src/kyverno
kyverno_helm_release_namespace: kyverno
kyverno_helm_kubeconfig: "{{ kubeconfig_path | default('/etc/kubernetes/admin.conf') }}"
kyverno_helm_values: {}

# Image signature verification policies. Every entry becomes an enforced
# cluster policy which rejects the pods whose images match "images"
# unless they carry a valid cosign signature from the given public key.
# The policy applies to all namespaces unless a list of namespaces is
# given, and the matched images are also mutated to their digest so that
# a verified tag cannot be moved afterwards.
#
# kyverno_verify_images:
#   - name: catalog
#     images:
#       - harbor.example.com/catalog/*
#     namespaces:
#       - my-namespace
#     public_key: |
#       -----BEGIN PUBLIC KEY-----
#       ...
#       -----END PUBLIC KEY-----
kyverno_verify_images: []
