# Namespace hosting the inference servers and the gateway.
#
# vllm_namespace: llm
vllm_namespace: llm

# Models to serve, each one running as its own deployment with an
# OpenAI-compatible service named "vllm-<name>". The optional "resources"
# mapping requests a full GPU by default, use a MIG resource to serve the
# model from a GPU slice, and the optional "args" list is appended to the
# vLLM command line.
#
# vllm_models:
#   - name: qwen3-32b
#     model: Qwen/Qwen3-32B
#     replicas: 1
#     resources:
#       nvidia.com/gpu: 1
#     args:
#       - --max-model-len
#       - "32768"
vllm_models: []

# Storage class backing the model cache volume of every server, an empty
# value uses the default storage class of the cluster.
#
# vllm_cache_storage_class: general
vllm_cache_storage_class: ""

# Size of the model cache volume of every server, which must hold the
# weights of the model it serves.
#
# vllm_cache_size: 100Gi
vllm_cache_size: 100Gi
